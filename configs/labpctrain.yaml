defaults:
  - platforms: labpc.yaml  # or platforms/windows
  - rl_env: single_agent_env.yaml
  - sb3: qr_dqn.yaml
  - wandb_callbacks : sb3_callback.yaml
  - models: visionmodelsix.yaml
  - lr_scheduler: exp_scheduler.yaml
  
extractors_out_dim: 64 # every extractor will produce an output with this dimension 

learn_args:
  total_timesteps: 12000000
  log_interval: 1
  reset_num_timesteps: True
  progress_bar: True
  tb_log_name: "QR_DQN"

gmi:
  launch: True
  tm_loader_profile_name: "default"
  headless: False
  port: 8775
  track : simple1_validated.Challenge.Gbx
  reference_line: tracks/reference_line/simple1_validated.npy
  automatic_prevent_sim_finish : True
  camera: 2

image:
  width: 128
  height: 128

wandb:
  use: True
  entity : tmnf-practical-ss25
  project : tmnf_dqn
  checkpoint_freq : 500000 # after how many steps should the model be saved automatically
  eval_freq : 900000 # after how many steps should we check if there is a new better model

