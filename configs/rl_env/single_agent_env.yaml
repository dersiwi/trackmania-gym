env: 
  _partial_: True
  _target_: trackmania_env.envs.single_agent_env2.TMNF_Single_Agent_Env
  position_buffer_size : 20
  position_moved_threshold : 0.8
  reset_mode : "respawn"
  reward_calculator : "basic"


obsmanager:
  observation_list: 
        - image
        - position
        - velocity
        - yaw_pitch_roll
        - scene_mobil.sync_vehicle_state.speed_forward
        - scene_mobil.input_steer
        - scene_mobil.async_vehicle_state.is_turbo
        - scene_mobil.engine.gear
        - input_finish_event.input_data_field
        - input_accelerate_event.time_field
        - scene_mobil.async_vehicle_state.rest_field
        - rotation_matrix

  colorspace : "rgb"
  convert_torch : true

wrappers:
  monitor: 
    _partial_: True
    _target_: stable_baselines3.common.monitor.Monitor 