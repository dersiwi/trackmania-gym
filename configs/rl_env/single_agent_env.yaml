defaults:
  - obs_manager: sophy_obs.yaml
  - reward_manager: next_point_rewards.yaml
  - termination_manager: timeout.yaml

env:
  _partial_: True
  _target_: trackmania_env.envs.single_agent_env2.TMNF_Single_Agent_Env

  n_previous_actions : 10

  reset_mode : "respawn"
  position_buffer_size : 20
  position_moved_threshold : 0.2

  normalize_rewards : True
  normalize_obs : True

  # all things related to image observations 
  obs_have_imgs : True
  normalize_images: True
  check_channels: True
  store_imgs_as_uint8 : False # if this is True, images are casted to uint8 by observation wrapper and not normalized (but remain in 0-255.) - Good for reducing replay buffer size and sb3 noramlizes images automaitcally

  game_speed : 70
  countdown_speed : 70

  wrap_obs_in_test : False  # Applies an test-wrapper to the observations.
  test : False

  startposition_accuracy_threshold : 0.5 # how close the start position has to be to the initial starting posiiton after each reset (in ingame-meters.)
  ignore_stuck_for_n_steps_after_reset : 80 
  automatic_prevent_sim_finish : True #If True, iface.prevent_sim_finish() is called automatically, once the current and target checkpoint are the same.
  disable_waitforstep_after_n_consecutive_timeouts : 5
  actions_per_second : 20
  waitforstep_timeout_in_s : 1.2 # this HAS to be smaller than the timeout of TMInterface
  use_rewind : True

  continuous_actions : True
  actionmode : 1    #thios is ugly (maybe do this with string, @see actionmap.py : 0 == discrete, 1 == 2d continuous, 2 == 4d continuous); only relevant when continuous_actions== TRue


wrappers:
  monitor: 
    _partial_: True
    _target_: stable_baselines3.common.monitor.Monitor 
