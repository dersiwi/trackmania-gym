constructor:
  _partial_: true
  _target_: sb3_contrib.tqc.TQC
  policy: "MultiInputPolicy"
  verbose: 1

algorithm_params:
  learning_rate: 0.0003
  buffer_size: 100000
  learning_starts: 100
  batch_size: 512
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  action_noise: null
  replay_buffer_class: null
  replay_buffer_kwargs: null
  optimize_memory_usage: False
  ent_coef: "auto"
  target_update_interval: 1
  target_entropy: "auto"
  top_quantiles_to_drop_per_net: 2
  use_sde: False
  sde_sample_freq: -1
  use_sde_at_warmup: False
  stats_window_size: 100
  seed: null
  _init_setup_model: True
