defaults:
  - rl_env: single_agent_env.yaml
  - sb3: ppo.yaml
  - wandb_callbacks : sb3_callback.yaml
  - models: visionmodelsix.yaml
  - lr_scheduler: dropoff_scheduling.yaml
  - policy: basic_policy.yaml

platforms_config_path : "configs/platforms.yaml"
extractors_out_dim: 64 # every extractor will produce an output with this dimension 
#share_features_extractor: True # whether to share the features extractor between actor and critic when applicable
debug: False
img_dump_freq: 1e6 # this is only relevant if debug=True
img_dump_path: null # this is only relevant if debug=True
headless: False

learn_args:
  total_timesteps: 80
  log_interval: 1
  reset_num_timesteps: True
  progress_bar: True
  tb_log_name: "PPO"

vectorized:
  vectorize : False
  obs_as_dict : True
  step_parallel : True 
  n_envs : 5
  tracks : ["another1.Challenge.Gbx", "another2.Challenge.Gbx", "another3.Challenge.Gbx", "simple1_validated.Challenge.Gbx", "curvy.Challenge.Gbx"]

gmi:
  launch: True
  tm_loader_profile_name: "default"
  headless: False
  port: 8775
  track : simple1_validated.Challenge.Gbx

wandb:
  use: True
  entity : tmnf-practical-ss25
  project : tmnf_ppo
  checkpoint_freq : 500000 # after how many steps should the model be saved automatically
  eval_freq : 1000000 # after how many steps should we check if there is a new better mode
  logminmax_continuous : False # If actions are continuous and this is True, then wandb logs min- and max- of actions per episode.
