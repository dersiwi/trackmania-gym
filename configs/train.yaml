defaults:
  - platforms: linux.yaml  # or platforms/windows
  - rl_env: single_agent_env.yaml
  - sb3: ppo.yaml
  - wandb_callbacks : sb3_callback.yaml
  - models: linesight_cnn.yaml

learn_args:
  total_timesteps: 4000000
  log_interval: 1
  reset_num_timesteps: True
  progress_bar: True
  tb_log_name: "PPO"

gmi:
  launch: True
  tm_loader_profile_name: "default"
  headless: False
  port: 8775
  track : Level1.Challenge.Gbx
  automatic_prevent_sim_finish : True

image:
  width: 100
  height: 100

wandb:
  use: True
  entity : tmnf-practical-ss25
  project : tmnf_ppo
  checkpoint_freq : 200000 # after how many steps should the model be saved automatically
  eval_freq : 400000 # after how many steps should we check if there is a new better model

