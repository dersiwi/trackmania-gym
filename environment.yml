name: tmnf_gym

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11.14
  - pip

  # Data & Vis
  - conda-forge::numpy=1.26.4
  - conda-forge::pandas=2.3.3
  - conda-forge::numba=0.62.1
  - conda-forge::matplotlib=3.9.1
  - opencv=4.10.0
  - conda-forge::wandb=0.23.0
  - pyqt=5.15.11 # Note: This is anaconda's version, adjust if needed
  - conda-forge::tensorboard=2.20.0
  - conda-forge::scipy=1.16.3
  - pillow=11.1.0

  # Deep Learning (PyTorch)
  - pytorch::pytorch=2.5.1
  - pytorch::torchvision=0.20.1
  - pytorch::torchaudio=2.5.1
  - pytorch::pytorch-cuda=12.4 # Keeping the generic 12.4 version
  - cudnn=9.15.1.9 # Keeping the anaconda channel version

  # Reinforcement Learning
  - conda-forge::gymnasium=1.0.0
  - conda-forge::stable-baselines3=2.7.0
  - conda-forge::sb3-contrib=2.6.0
  - conda-forge::hydra-core=1.3.2
  - conda-forge::omegaconf=2.3.0

  # System/Core Libraries (Non-Python and common utilities)
  - conda-forge::libgcc-ng=15.2.0
  - conda-forge::libstdcxx-ng=15.2.0
  - conda-forge::libgfortran-ng=15.2.0
  - conda-forge::ld_impl_linux-64=2.45
  - conda-forge::zlib=1.3.1
  - conda-forge::libpng=1.6.51
  - libtiff=4.5.1
  - intel-openmp=2022.1.0
  - mkl=2022.1.0
  - conda-forge::llvm-openmp=15.0.7
  - conda-forge::llvmlite=0.45.1
  - conda-forge::protobuf=4.25.3

  # Utils & Other Python Packages
  - conda-forge::pyvirtualdisplay=3.0
  - conda-forge::tqdm=4.67.1
  - conda-forge::rich=14.2.0
  - conda-forge::setuptools=80.9.0
  - conda-forge::packaging=25.0
  - conda-forge::requests=2.32.5
  - conda-forge::pyyaml=6.0.3
  - conda-forge::six=1.17.0
  - conda-forge::click=8.3.1
  - conda-forge::tornado=6.5.2

  # PIP Dependencies
  - pip:
    - tminterface==1.0.2 # Trackmania Interface
    - keyboard==0.13.5
    - pynput==1.8.1
    - bytefield==1.0.2
    - python-libxdo==0.1.2a1
    - xdotool==0.4.0
    - evdev==1.9.2
    # You may want to add these for Windows if needed:
    # - win32gui
    # - pydirectinput

# Note on CUDA components:
# All 'nvidia/label/cuda-11.4.2' packages were removed.
# The environment relies on the generic 'pytorch-cuda=12.4' and 'cudnn=9.15.1.9' for GPU support.
